<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<title>화면 싱크 매니저</title>
	<script src="../lib/SubtitleObject.js"></script>
	<script src="../lib/popup.js"></script>
	<script>
windowName = "addon";

// 초기 상태 기억
let tab = null;
const origins = [];

const RANGE = 10; // 현재 싱크 전후로 렌더링할 범위
let mode = 1;
const M = [null, "", "_", "~"]; // 모드에 따른 파일명 끝 표시
let test = false;

window.thumbDir = "../../temp/thumbnails"; // 웹샘플에서 경로 수정 가능하도록 분리

ready(async () => {
	if (opener && opener.tabs && opener.tabs.length) {
		tab = opener.tabs[opener.tabIndex];
		Subtitle.video = opener.Subtitle.video;
	} else {
		await alert("작업 대상이 없습니다.");
		window.close();
		return;
	}
	
	if (!Subtitle.video.fs.length) {
		await alert("동영상 프레임 분석이 끝나야 진행할 수 있습니다.");
		window.close();
		return;
	}
	
	if (Subtitle.video.path?.endsWith("ts")) {
		alert("ts/m2ts 파일에 대해선 섬네일이 정상적으로 생성되지 않습니다.");
	}
	
	if (!window.chrome?.webview && opener?.binder?._) {
		alert("웹샘플에서는 수동 렌더링 작업이 필요합니다.\nSyncManager 대신, Aegisub에 의존하는 구버전 SyncManager0을 활용할 수도 있습니다.");
		test = true;
	}
	
	const TX = (opener.setting.sync.uiWidth  ? opener.setting.sync.uiWidth  : 96);
	const TY = (opener.setting.sync.uiHeight ? opener.setting.sync.uiHeight : 54);
	{
		const styleSize = document.getElementById("styleSize");
		styleSize.innerHTML = styleSize.innerHTML.replaceAll("96px", TX + "px").replaceAll("54px", TY + "px");
	}
	
	{
		// 현재 선택된 홀드 기준
		const hold = (opener && opener.SmiEditor) ? opener.SmiEditor.selected : null;
		const origin = hold.getText(true);
		origin.hold = hold;
		origin.lines = hold.lines;
		
		origin.start = 0;
		origin.end = 0;
		
		if (hold.isAssHold) {
			// ASS만 작업
			origin.assBody = origin.hold.assEditor.syncs;
			origins.push(origin);
			
		} else {
			if (origin.selection[0] != origin.selection[1]) {
				// 블록지정 있으면 해당 홀드의 선택 범위만 작업
				origin.start = origin.text.substring(0, origin.selection[0]).split("\n").length - 1;
				origin.end   = origin.text.substring(0, origin.selection[1]).split("\n").length;
				origin.assBody = [];
				origins.push(origin);
				
			} else {
				// 전체 작업
			}
		}
	}
	
	let count = 0;
	
	if (origins.length) {
		// 선택된 홀드만 작업
		const origin = origins[0];
		
		const lines = origin.lines.slice(origin.start, origin.end);
		for (let i = 0; i < lines.length; i++) {
			lines[i] = lines[i].TEXT;
		}
		origin.smiFile = new Subtitle.SmiFile(lines.join("\n"));
		count = origin.smiFile.body.length + origin.assBody.length;
		
	} else {
		// 모든 홀드에 대해 작업
		const holds = tab.holds.slice(0);
		holds.push(tab.assHold);
		
		holds.forEach((hold) => {
			const origin = hold.getText(true);
			origin.hold = hold;
			origin.lines = hold.lines;
			
			origin.start = 0;
			origin.end = origin.text.split("\n").length;
			origin.assBody = origin.hold.assEditor ? origin.hold.assEditor.syncs : [];
			
			const lines = origin.lines.slice(origin.start, origin.end);
			for (let i = 0; i < lines.length; i++) {
				lines[i] = lines[i].TEXT;
			}
			origin.smiFile = new Subtitle.SmiFile(lines.join("\n"));
			count += origin.smiFile.body.length + origin.assBody.length;
			
			origins.push(origin);
		});
	}
	
	if (!count) {
		await alert("작업 대상이 없습니다.");
		window.close();
		return;
	}
	
	const fs = Subtitle.video.fs;
	const kfs = Subtitle.video.kfs;
	const trustKeyFrame = opener.SmiEditor.trustKeyFrame;
	const renderFromKeyframe = Subtitle.video.path && Subtitle.video.path.endsWith(".m2ts");
	
	const tbody = document.getElementById("editor").querySelector("tbody");
	tbody.innerHTML = "";
	const framesStorage = document.createElement("div");
	
	const frameSyncs = [];
	
	function setFrames(frames, frameIndex, flag) {
		for (let j = -RANGE; j < RANGE; j++) {
			const imgIndex = frameIndex + j;
			const img = document.createElement("img");
			img.classList.add("frame", "img" + imgIndex + flag);
			img.style.left = (j * (TX + 2)) + "px";
			eData(img, { index: imgIndex, offset: j });
			if (trustKeyFrame && Subtitle.findSync(fs[imgIndex], kfs, false)) {
				img.classList.add("keyframe");
			}
			frames.append(img);
		}
	}
	
	origins.forEach((origin, oi) => {
		let lastIndex = -1;
		let count = 0;
		if (origin.smiFile.body) {
			// SMI
			let lastFade = 0;
			origin.smiFile.body.forEach((smi) => {
				let fade = 0;
				if (smi.text.indexOf("\\fad(")) {
					if (smi.text.indexOf("\\fad(0")) {
						// ASS 페이드인
						fade = 1;
					} else {
						// ASS 페이드아웃
						fade = -1;
					}
				} else {
					// SMI 페이드 여부 확인
					const attrs = smi.toAttrs();
					for (let j = 0; j < attrs.length; j++) {
						const attr = attrs[j];
						if (attr.fade == -1 || attr.fade == 1) {
							fade = attr.fade;
							break;
						}
					}
				}
				
				const tr = document.createElement("tr");
				eData(tr, { oi: oi, smi: smi, origin: smi.start });
				
				const sync = document.createElement("td");
				sync.classList.add("sync");
				
				if (smi.syncType == Subtitle.SyncType.frame) {
					const frameIndex = Subtitle.findSyncIndex(smi.start, fs);
					
					const frames = document.createElement("div");
					frames.classList.add("frames");
					
					setSync(sync, ((frameIndex < fs.length) ? fs[frameIndex] : 35999999));
					framesStorage.append(frames);
					tr.classList.add("fs");
					tr.append(document.createElement("td"), sync);
					frameSyncs.push(tr);
					
					let flag = "";
					if (fade == 1) {
						// 페이드인 시작 이미지 밝게
						flag = "b";
					} else if (fade == -1) {
						// 페이드아웃 시작 이미지 어둡게
						flag = "d";
					} else if (lastFade == -1) {
						// 페이드아웃 종료 이미지 밝게
						flag = "b";
					} else if (lastFade == 1) {
						// 페이드인 종료 이미지 어둡게
						flag = "d";
					}
					eData(tr, { index: (lastIndex = frameSyncs.length - 1), frames: frames, frameIndex: frameIndex, offset: 0, flag: flag });
					count = 0;
					
					setFrames(frames, frameIndex, flag);
					
				} else {
					sync.innerText = (smi.syncType == Subtitle.SyncType.inner ? "~" : smi.start);
					tr.append(document.createElement("td"), sync);
					eData(tr, { index: (frameSyncs.length - 1) + (++count / 10000) }); // 10000개를 넘어갈 일은 없을 것
				}
				{
					const td = document.createElement("td");
					td.innerText = smi.text.replaceAll("\n", "");
					td.title = smi.text;
					tr.append(td);
					tbody.append(tr);
				}
				
				lastFade = fade;
			});
		}
		if (origin.assBody) {
			// ASS
			origin.assBody.forEach((ass) => {
				let start = Number(ass.inputStart.value);
				let end   = Number(ass.inputEnd  .value);
				
				{	// start
					const tr = document.createElement("tr");
					eData(tr, { ass: ass, type: "start", origin: start });
					
					const sync = document.createElement("td");
					sync.classList.add("sync");
					
					if (ass.checkStart.checked) {
						const frameIndex = Subtitle.findSyncIndex(start, fs);
						
						const frames = document.createElement("div");
						frames.classList.add("frames");
						
						setSync(sync, ((frameIndex < fs.length) ? fs[frameIndex] : 35999999));
						framesStorage.append(frames);
						tr.classList.add("fs");
						tr.append(document.createElement("td"), sync);
						frameSyncs.push(tr);
						
						// TODO: 페이드는?
						let flag = "";
						
						eData(tr, { index: (lastIndex = frameSyncs.length - 1), frames: frames, frameIndex: frameIndex, offset: 0, flag: flag });
						count = 0;
						
						setFrames(frames, frameIndex, flag);
						
					} else {
						sync.innerText = start;
						tr.append(document.createElement("td"), sync);
						eData(tr, { index: (frameSyncs.length - 1) + (++count / 1000) }); // 1000개를 넘어갈 일은 없을 것
					}
					{
						const assText = ass.inputText.value;
						const td = document.createElement("td");
						td.rowSpan = 2;
						td.innerText = assText.replaceAll("\n", "");
						td.title = assText.replaceAll("{", "\n{").replaceAll("}", "}\n");
						tr.append(td);
						tbody.append(tr);
					}
				}
				
				{	// end
					const tr = document.createElement("tr");
					eData(tr, { ass: ass, type: "end", origin: end });
					
					const sync = document.createElement("td");
					sync.classList.add("sync");
					
					if (ass.checkEnd.checked) {
						const frameIndex = Subtitle.findSyncIndex(end, fs);
						
						const frames = document.createElement("div");
						frames.classList.add("frames");
						
						setSync(sync, ((frameIndex < fs.length) ? fs[frameIndex] : 35999999));
						framesStorage.append(frames);
						tr.classList.add("fs");
						tr.append(document.createElement("td"), sync);
						frameSyncs.push(tr);
						
						// TODO: 페이드는?
						let flag = "";
						
						eData(tr, { index:(lastIndex = frameSyncs.length - 1), frames: frames, frameIndex: frameIndex, offset: 0, flag: flag });
						count = 0;
						
						setFrames(frames, frameIndex, flag);
						
					} else {
						sync.innerText = end;
						tr.append(document.createElement("td"), sync);
						eData(tr, { index: lastIndex + (++count / 10000) }); // 10000개를 넘어갈 일은 없을 것
					}
					tbody.append(tr);
				}
			});
		}
	});
	
	function renderThumbnails() {
		const datas = [];
		[...tbody.querySelectorAll("tr.fs")].forEach((tr) => {
			datas.push(eData(tr));
		});
		// ASS 지원하면서 정렬 기능이 필요해짐
		datas.sort((a, b) => {
			return a.frameIndex - b.frameIndex;
		});
		
		const renderList = [];
		let renderGroup = { end: -11 };
		
		datas.forEach((data) => {
			let begin = data.offset + (data.frameIndex < RANGE ? 0 : data.frameIndex - RANGE)
			const end = data.offset + (data.frameIndex + RANGE > fs.length ? fs.length : data.frameIndex + RANGE);
			begin = Math.max(0, begin); // 음수가 되면 안 됨
			
			let fs0 = fs[begin];
			if (renderFromKeyframe) {
				// 필요한 프레임 바로 앞 키프레임 찾기
				let index = Subtitle.findSyncIndex(fs0, kfs);
				if (kfs[index] > fs0) {
					index--;
				}
				fs0 = kfs[index];
			}
			
			if ((renderGroup.flag == data.flag)
			 && (fs0 < fs[renderGroup.end] + 500) // 렌더링에 필요한 프레임이 앞쪽과 500ms 이내로 이어질 때
			) {
				renderGroup.end = end;
				
			} else {
				renderList.push(renderGroup = {
						flag: data.flag
					,	time: Math.max(0, fs0 - 1) // 반올림된 경우 고려해서 -1
					,	begin: begin
					,	end: end
				});
			}
			
			let imgs = [...data.frames.children];
			for (let j = data.offset - RANGE; j < data.offset + RANGE; j++) {
				const imgIndex = data.frameIndex + j;
				const cName = "img" + imgIndex + data.flag;
				if (!data.frames.querySelector("." + cName)) {
					const img = document.createElement("img");
					img.classList.add("frame", cName);
					img.style.left = (j * (TX + 2)) + "px";
					eData(img, { index: imgIndex, offset: j });
					if (trustKeyFrame && Subtitle.findSync(fs[imgIndex], kfs, false)) {
						img.classList.add("keyframe");
					}
					imgs.push(img);
				}
			}
			imgs.sort((a, b) => {
				const v = eData(a).index - eData(b).index;
				return (v > 0) ? 1 : ((v < 0) ? -1 : 0);
			});
			imgs.forEach((img) => {
				data.frames.append(img);
			});
		});
		if (renderList.length == 0) {
			return false;
		}
		
		// 이미지 렌더링 요청
		let params = [];
		renderList.forEach((group) => {
			// [ 시작시간, 길이, 시작인덱스, 종료인덱스, 플래그 ]
			const len = (group.end < fs.length ? fs[group.end] : fs[fs.length - 1]) - group.time;
			params.push([group.time, len, group.begin, group.end, group.flag].join(","));
		});
		opener.binder.renderThumbnails(Subtitle.video.path, params.join("\n"));
		return true;
	}
	if (!renderThumbnails()) {
		await alert("작업 대상이 없습니다.");
		window.close();
		return;
	}
	
	{	// 웹샘플 렌더링 에뮬레이션
		const emulLayer   = document.getElementById("emulLayer"  );
		const inputFFmpeg = document.getElementById("inputFFmpeg");
		const inputServer = document.getElementById("inputServer");
		const inputFile   = document.getElementById("inputFile"  );
		const taCmd       = document.getElementById("taCmd"      );
		const form = emulLayer.querySelector("form");
		
		let cmd = "";
		inputFile.addEventListener("input", (e) => {
			taCmd.value = cmd.replaceAll("{path}"  , inputFile  .value)
			                 .replaceAll("{ffmpeg}", inputFFmpeg.value);
		});
		inputFFmpeg.addEventListener("input", (e) => {
			taCmd.value = cmd.replaceAll("{path}"  , inputFile  .value)
			                 .replaceAll("{ffmpeg}", inputFFmpeg.value);
		});
		inputFile  .value = opener.setting?.syncManager?.file   ?? "";
		inputFFmpeg.value = opener.setting?.syncManager?.ffmpeg ?? "";
		inputServer.value = opener.setting?.syncManager?.server ?? "http://localhost:8000";
		
		let renders = [];
		form.addEventListener("submit", (e) => {
			e.preventDefault();
			opener.setting.syncManager = {
					file  : inputFile  .value
				,	ffmpeg: inputFFmpeg.value
				,	server: inputServer.value
			}
			opener.saveSetting();
			
			thumbDir = inputServer.value + "/thumbnails/";
			renders.forEach((render) => {
				opener.afterRenderThumbnails(render[0], render[1], render[2]);
			});
			emulLayer.style.display = "none";
		});
		form.addEventListener("reset", (e) => {
			e.preventDefault();
			emulLayer.style.display = "none";
		});
		
		opener.emulateRenderThumbnail = function(currentCmd, currentRenders) {
			emulLayer.style.display = "block";
			cmd = currentCmd;
			renders = currentRenders;
			inputFile.dispatchEvent(new Event("input", { bubbles: true }));
			setTimeout(() => {
				inputFile.focus();
			}, 1);
		}
	}
	
	let fileSeq = 0;
	opener.setThumbnailsFileSeq = function(thumbnailsFileSeq) {
		fileSeq = thumbnailsFileSeq;
	}
	
	let renderBegins = -1;
	const renderInfo = document.getElementById("renderInfo");
	
	// 렌더링 중일 때 색깔 넣어줌
	opener.startRenderThumbnails = function(begin, end, flag) {
		renderBegins = begin;
		renderInfo.style.display = "block";
		renderInfo.innerText = `${fs[begin]}~${fs[end]}`;
		
		for (let i = begin; i < end; i++) {
			const imgs = [...tbody.querySelectorAll(`img.img${i}${flag}`)];
			imgs.push(...framesStorage.querySelectorAll(`img.img${i}${flag}`));
			imgs.forEach((img) => {
				img.classList.add("rendering");
			});
		}
		document.body.dispatchEvent(new Event("scroll", { bubbles: true }));
	}
	opener.startCompareThumbnails = function (begin, end, flag) {
		for (let i = begin; i < end; i++) {
			const imgs = [...tbody.querySelectorAll(`img.img${i}${flag}`)];
			imgs.push(...framesStorage.querySelectorAll(`img.img${i}${flag}`));
			imgs.forEach((img) => {
				img.classList.remove("rendering");
				img.classList.add("comparing");
			});
		}
		document.body.dispatchEvent(new Event("scroll", { bubbles: true }));
	}
	
	// 렌더링 완료 후 이미지 세팅
	// 미리 값을 넣어주면 삭제되지 않은 다른 영상 섬네일 가져올 수 있음
	opener.afterRenderThumbnails = function(begin, end, flag, isReuse=false) {
		if (renderBegins == begin) {
			// 마지막 렌더링인 경우
			renderBegins = -1;
			renderInfo.style.display = "none";
		}
		
		let requiredDiffs = [];
		
		for (let i = begin; i < end; i++) {
			const imgs = [...tbody.querySelectorAll(`img.img${i}${flag}`)];
			imgs.push(...framesStorage.querySelectorAll(`img.img${i}${flag}`));
			imgs.forEach((img) => {
				img.classList.remove("comparing");
				eData(img, { img: i + flag });
			});
			if (!diffs[i]) {
				requiredDiffs.push(i);
			}
		}
		document.body.dispatchEvent(new Event("scroll", { bubbles: true }));
		
		if (isReuse) {
			// 기존 렌더링 재활용이면 없는 비교값 요청해야 함
			opener.binder.getDiffs(requiredDiffs.join(","));
		}
	}
	// C#에서 프레임 간 비교값 수치화해서 전달
	window.diffs = {}; // 1920x1080x3x255 = 1586304000 < Int.MaxValue이므로 정수로 받아오기...?
	window.fades = {}; // 밝기 변화 상대 수치가 필요하므로, 픽셀수로 나눈 부동소수점 값
	opener.setDiffs = function(strDiffs) {
		strDiffs.split("\n").forEach((strDiff) => {
			const diff = strDiff.split(",");
			const key = Number(diff[0]);
			diffs[key] = Number(diff[1]);
			fades[key] = Number(diff[2]);
		});
		if (test) {
			document.body.dispatchEvent(new Event("scroll", { bubbles: true }));
		}
	}
	
	window.selected = -1;
	function select(index, tr=null) {
		if (selected == index) return;
		
		const byKeyboard = (tr === true);
		let scrollMargin = 30;
		
		if (byKeyboard) {
			tr = null;
			scrollMargin = opener.setting.scrollMargin * 30;
		}
		
		selected = index;
		if (tr == null) {
			tr = frameSyncs[selected];
		}
		
		tbody.querySelector("tr.selected")?.classList.remove("selected");
		tr.classList.add("selected");
		
		const offsetTop = tr.offsetTop - document.body.scrollTop;
		if (offsetTop < (byKeyboard ? scrollMargin : 0)) {
			document.body.scrollTo({
					top: tr.offsetTop - scrollMargin
				,	left: 0
				,	behavior: "smooth"
			});
		} else {
			const bottom = offsetTop + TY + 2;
			const margin = document.body.clientHeight - bottom;
			if (margin < (byKeyboard ? scrollMargin : 0)) {
				document.body.scrollTo({
						top: document.body.scrollTop - margin + scrollMargin
					,	left: 0
					,	behavior: "smooth"
				});
			}
		}
	}
	function setSync(td, sync) {
		td.innerText = (sync == 0 ? 1 : sync);
		if (!trustKeyFrame) return;
		if (Subtitle.findSync(sync, kfs, false)) {
			td.classList.add   ("keyframe");
		} else {
			td.classList.remove("keyframe");
		}
	}
	function moveSync(direction, isOffset=false) {
		const tr = frameSyncs[selected];
		const data = eData(tr);
		
		const offset = isOffset ? direction : (data.offset + direction);
		//if (offset < -12 || offset >= 12) return;
		
		const index = data.frameIndex + offset;
		if (index < 0) return;
		
		eData(tr, { offset: offset });
		data.frames.style.left = (`calc(50% - ${ offset * (TX + 2) }px)`);
		
		setSync(tr.querySelector("td.sync"), fs[index]);
	}
	
	// 자동 맞춤 계산
	const rates = [1, 0.99, 0.96, 0.92, 0.84, 0.68, 0.5, 0.4];
	function setAuto() {
		let wasFade = false;
		[...tbody.querySelectorAll("tr.fs")].forEach((tr) => {
			const info = eData(tr);
			const frameIndex = info.frameIndex + info.offset;
			if (typeof diffs[frameIndex] != "number") {
				// 렌더링 안 된 상태면 진행하지 않음
				return;
			}
			
			let begin = frameIndex - 8;
			let end   = frameIndex + 8;
			if (begin < 0) begin = 0;
			if (end > Subtitle.video.fs.length) end = Subtitle.video.fs.length;
			while (typeof diffs[begin] != "number") begin++;
			while (typeof diffs[end  ] != "number") end--;
			
			const tdSync = tr.querySelector("td.sync");
			const tdText = tdSync.nextSibling.innerText;
			const isFade = tdText.indexOf("fade=") > 0
						|| (tdText.indexOf("\\fad") > 0 && tdText.indexOf("\\fad(0,") < 0) // 첫 번째 항목이 0이면 현재 싱크는 페이드가 아님
						|| tdText.indexOf("페이드") > 0
						;
			let newFrameIndex = -1;
			
			if (isFade) {
				// 페이드 시작
				let last = 0;
				let i = end - 1;
				// 밝기 변화 성분을 가진 프레임 찾기
				for (; i >= begin; i--) {
					const fade = fades[i];
					if (Math.abs(fade) > 2) { // 2/255 이상의 밝기 변화
						const prev = fades[i-1];
						if (Math.abs(prev) > 2 && fade * prev > 0) {
							// 같은 방향성이 연속된 경우
							last = fade;
							break;
						}
					}
				}
				// 역방향 탐색 시 밝기 변화가 사라지는 지점 찾기
				if (last) {
					let sum = last;
					let count = 1;
					for (; i >= begin; i--) {
						const fade = fades[i];
						if (fade / (sum / count) < 0.2) { // 밝기 변화량이 평균의 1/5 미만 or 방향 반전
							newFrameIndex = i + 1;
							break;
						}
						sum += fade;
						count++;
					}
				}
				wasFade = true;
				
			} else if (wasFade) {
				// 페이드 종료
				let last = 0;
				let i = begin;
				// 밝기 변화 성분을 가진 프레임 찾기
				for (; i < end; i++) {
					const fade = fades[i];
					if (Math.abs(fade) > 2) { // 2/255 이상의 밝기 변화
						const next = fades[i+1];
						if (Math.abs(next) > 2 && fade * next > 0) {
							// 같은 방향성이 연속된 경우
							last = fade;
							break;
						}
					}
				}
				// 정방향 탐색 시 밝기 변화가 사라지는 지점 찾음
				if (last) {
					let sum = last;
					let count = 1;
					for (; i < end; i++) {
						const fade = fades[i];
						if (fade / (sum / count) < 0.2) { // 밝기 변화량이 평균의 1/5 미만 or 방향 반전
							newFrameIndex = i - 1;
							break;
						}
						sum += fade;
						count++;
					}
				}
				wasFade = false;
				
			} else {
				// 전후 프레임의 변화량 대비 현재 프레임의 변화량
				// 원래는 변화 배율로 해보려고 했는데, 애니메이션의 실질 프레임이 ½~⅓이어서 튀는 값이 자주 발생함
				let maxDiff = 0;
				for (let i = begin; i < end; i++) {
					if (maxDiff < diffs[i]) {
						maxDiff = diffs[i];
					}
				}
				
				const maxPoint = { index: -1, point: 0 };
				for (let i = begin; i < end; i++) {
					let d = 0;
					if (1 < i && i < opener.Subtitle.video.fs.length - 2) {
						d += 2 * diffs[i] - ((diffs[i-1] + diffs[i+1]) / 2);
					} else {
						if (i == 1) {
							d += 2 * diffs[i] - diffs[i+1];
						} else if (i == opener.Subtitle.video.fs.length - 2) {
							d += 2 * diffs[i] - diffs[i-1];
						} else {
							d = maxDiff / 2;
						}
					}
					// 원래 싱크와의 거리에 따라 점수 보정
					const point = d * rates[Math.abs(i - frameIndex)];
					if (maxPoint.point < point) {
						maxPoint.index = i;
						maxPoint.point = point;
					}
				}
				newFrameIndex = maxPoint.index;
			}
			
			// moveSync 함수와 같은 내용
			if (newFrameIndex < 0) return;
			
			const offset = newFrameIndex - info.frameIndex;
			eData(tr, { offset: offset });
			info.frames.style.left = (`calc(50% - ${ offset * (TX + 2) }px)`);
			
			setSync(tdSync, fs[newFrameIndex]);
		});
	}
	
	function apply() {
		const smis = [];
		for (let oi = 0; oi < origins.length; oi++) {
			smis[oi] = [];
		}
		let countSmi = 0;
		[...tbody.querySelectorAll("tr")].forEach((tr) => {
			const data = eData(tr);
			if (data.smi) {
				if (tr.classList.contains("fs")) {
					data.smi.start = Number(tr.querySelector(".sync").innerText);
				}
				smis[data.oi].push(data.smi);
				countSmi++;
				
			} else if (data.ass && tr.classList.contains("fs")) {
				const sync = Number(tr.querySelector(".sync").innerText);
				if (data.type == "start") {
					data.ass.inputStart.value = sync;
				} else if (data.type == "end") {
					data.ass.inputEnd.value = sync;
				}
				data.ass.update();
			}
		});
		if (!countSmi) {
			// SMI 내역 없음 = ASS 편집
			return;
		}
		
		// 중간 싱크 재계산
		smis.forEach((hold) => {
			let startIndex = -1;
			for (let i = 1; i < hold.length; i++) {
				if (hold[i].syncType == Subtitle.SyncType.inner) {
					if (startIndex < 0) {
						startIndex = i - 1;
					}
				} else {
					if (startIndex >= 0) {
						const endIndex = i;
						const startSync = hold[startIndex].start;
						const endSync   = hold[endIndex  ].start;
						const count = endIndex - startIndex;
						
						for (let j = 1; j < count; j++) {
							hold[startIndex + j].start = Math.round(((count - j) * startSync + j * endSync) / count);
						}
						startIndex = -1;
					}
				}
			}
		});
		
		origins.forEach((origin, oi) => {
			const result = new Subtitle.SmiFile();
			result.header = origin.smiFile.header;
			result.footer = origin.smiFile.footer;
			result.body = smis[oi];
			
			// 해당 줄 앞뒤 전체 선택되도록 조정
			const origLines = origin.text.split("\n");
			const prev = origLines.slice(0, origin.start).join("\n");
			const next = origLines.slice(origin.end).join("\n");
			
			// 에디터에 적용
			const text = (prev ? prev + "\n" : "") + result.toText() + (next ? "\n" + next : "");
			// 현재 커서 위치를 기반으로 다시 맞춤
			const selectedLine = origin.hold.getValue().substring(0, origin.hold.getCursor()[1]).split("\n").length;
			const cursor = text.split("\n").slice(0, selectedLine - 1).join("\n").length + 1;
			origin.hold.setText(text, [cursor, cursor]);
		});
	}
	
	tbody.addEventListener("click", (e) => {
		let el;
		if (el = e.target.closest("tr")) {
			select(eData(el).index, el);
		}
		if (el = e.target.closest("img.frame")) {
			select(eData(el.closest("tr")).index);
			moveSync(eData(el).offset, true);
		}
	});
	tbody.addEventListener("dblclick", (e) => {
		const tr = e.target.closest("tr.fs");
		if (tr) {
			// 에디터 해당 싱크로 이동
			opener.SmiEditor.selected.findSync(Number(tr.querySelector("td.sync").innerText) + 1);
		}
	});
	
	document.addEventListener("keydown", (e) => {
		if (emulLayer.style.display == "block") {
			// 웹샘플 에뮬레이션 레이어 켜져있을 땐 키보드 동작 원래대로
			return;
		}
		switch (e.key) {
			case "ArrowUp": {
				e.preventDefault();
				if (e.ctrlKey || selected == 0) {
					document.body.scrollTo({
							top: document.body.scrollTop - (TY + 2)
						,	left: 0
						,	behavior: "smooth"
					});
					break;
				}
				if (selected > 0) {
					if (selected % 1) {
						select(Math.floor(selected), true);
					} else {
						select(selected - 1, true);
					}
				}
				break;
			}
			case "ArrowDown": {
				e.preventDefault();
				if (e.ctrlKey || selected == frameSyncs.length - 1) {
					document.body.scrollTo({
							top: document.body.scrollTop + (TY + 2)
						,	left: 0
						,	behavior: "smooth"
					});
					break;
				}
				if (selected < frameSyncs.length - 1) {
					if (selected % 1) {
						select(Math.ceil(selected), true);
					} else {
						select(selected + 1, true);
					}
				}
				break;
			}
			case "ArrowLeft": {
				moveSync(-1);
				break;
			}
			case "ArrowRight": {
				moveSync(+1);
				break;
			}
			case "Delete": {
				moveSync(0, true);
				break;
			}
			case "q": {
				if (!e.shiftKey && e.ctrlKey && !e.altKey) {
					opener.binder.moveTo(Number(frameSyncs[selected].querySelector(".sync").innerText) - 2000);
				}
				break;
			}
		}
	});
	document.addEventListener("keydown", (e) => {
		if (e.target.closest("input[name=mode]")) {
			// 모드 선택 후에도 방향키 조작은 원래대로 동작해야 함
			e.preventDefault();
		}
	});
	
	tbody.addEventListener("load", function(e) {
		if (e.target.closest("img")) {
			// 이미지 로딩 성공 후엔 추가 갱신 없도록 함
			eData(this, { img: null });
		}
	});
	function refreshImages(imgs) {
		if (test) {
			[...imgs].forEach(function (img) {
				if (mode > 1 && !img.previousSibling) {
					// 첫 번째 이미지는 기본 모드에서만 존재
					return;
				}
				const index = eData(img).index;
				
				img.style.background = "#aaa";
				try {
					if (mode == 2) {
						const v = diffs[index] * 255;
						img.style.background = `rgb(${v},${v},${v})`;
					} else if (mode == 3) {
						const v = fades[index] * 255;
						if (v > 0) {
							img.style.background = `rgb(${v},0,0)`;
						} else {
							img.style.background = `rgb(0,0,${-v})`;
						}
					}
				} catch (e) {
					console.log(e);
				}
			});
			return;
		}
		[...imgs].forEach(function (img) {
			if (mode > 1 && !img.previousSibling) {
				// 첫 번째 이미지는 기본 모드에서만 존재
				return;
			}
			const imgKey = eData(img).img;
			if (!imgKey) return;
			img.src = (`${thumbDir}/${fileSeq}_${imgKey}${M[mode]}.jpg`);
		});
	}
	function showFrames(tr) {
		const showing = tr.classList.contains("showing");
		const frames = eData(tr).frames;
		refreshImages(frames.querySelectorAll("img"));
		if (!showing) {
			tr.classList.add("showing");
			tr.querySelector("td").append(frames);
		}
	}
	function hideFrames(tr) {
		if (tr.classList.contains("showing")) {
			tr.classList.remove("showing");
		}
		framesStorage.append(eData(tr).frames);
	}
	window.addEventListener("resize", (e) => {
		document.body.dispatchEvent(new Event("scroll", { bubbles: true }));
	});
	document.body.addEventListener("scroll", (e) => {
		let status = -1;
		[...document.querySelectorAll("#editor tbody tr.fs")].forEach((tr) => {
			
			if (status < 1) {
				const offsetTop = tr.offsetTop - document.body.scrollTop; 
				
				if (status < 0) {
					if (offsetTop + TY + 2 < 0) {
						// 위쪽에 있어서 안 보임
						hideFrames(tr);
						return;
					}
				}
				if (offsetTop > document.body.clientHeight) {
					// 아래쪽에 있어서 안 보임
					hideFrames(tr);
					return;
				}
				
				showFrames(tr);
				
			} else {
				// 아래쪽에 있어서 안 보임
				hideFrames(tr);
			}
		});
	});
	document.body.dispatchEvent(new Event("scroll", { bubbles: true }));
	
	document.getElementById("inputShift").addEventListener("keydown", (e) => {
		// 가중치 입력 중엔 방향키 조작 차단
		e.stopPropagation();
	});
	
	const form = document.getElementById("formShift");
	form.addEventListener("submit", (e) => {
		e.preventDefault();
		
		const shift = Number(document.getElementById("inputShift").value);
		[...document.querySelectorAll("#editor tbody tr.fs")].forEach((tr) => {
			const data = eData(tr);
			const frameIndex = Subtitle.findSyncIndex(data.origin, fs);
			const shiftIndex = Subtitle.findSyncIndex(data.origin + shift, fs);
			const offset = shiftIndex - frameIndex;
			eData(tr, { offset: offset });
			data.frames.style.left = (`calc(${ -(TX + 2) * offset }px + 50%`);
			setSync(tr.querySelector("td.sync"), fs[shiftIndex]);
		});
	});
	form.addEventListener("click", (e) => {
		if (e.target.closest("input[name=mode]")) {
			mode = form.querySelector("input[name=mode]:checked").value;
			refreshImages(tbody.querySelectorAll("img"));
			for (let i = 1; i <= 3; i++) {
				if (i == mode) {
					document.body.classList.add   ("mode" + i);
				} else {
					document.body.classList.remove("mode" + i);
				}
			}
		}
	});
	
	document.getElementById("btnAuto").addEventListener("click", () => {
		setAuto();
	});
	
	document.getElementById("btnApply").addEventListener("click", () => {
		apply();
		// 조정한 타이밍에 맞춰서 추가 렌더링
		renderThumbnails();
	});
	document.getElementById("btnSet").addEventListener("click", () => {
		apply();
		window.close();
	});
	
	// 페이지 벗어날 경우 렌더링 취소
	window.addEventListener("beforeunload", () => {
		opener.binder.cancelRenderThumbnails();
	});
	
	select(0);
});
